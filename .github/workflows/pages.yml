name: Build and Deploy Pages

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 可选，指定单日例行同步日期（YYYYMMDD 或 YYYY-MM-DD）；留空则取北京时间前一天
        required: false
        type: string
      backfill_start_date:
        description: 可选，历史回填开始日期（YYYYMMDD 或 YYYY-MM-DD）；填写后需同时填写结束日期
        required: false
        type: string
      backfill_end_date:
        description: 可选，历史回填结束日期（YYYYMMDD 或 YYYY-MM-DD）
        required: false
        type: string
      backfill_areas:
        description: 回填功能区：all 或 dragon_tiger,market_overview,graphs,stock_locations
        required: false
        type: string
        default: all
      backfill_from_json:
        description: 使用已有 JSON 离线回填数据库，不重新抓取网络数据（支持 all/dragon_tiger/market_overview/graphs）
        required: false
        type: boolean
        default: false
      force_run:
        description: 忽略 A 股交易日历，强制运行目标日期/区间
        required: false
        type: boolean
        default: false
      market_overview_year:
        description: 可选，额外生成年度行业强弱榜单
        required: false
        type: string
      build_graphs:
        description: 是否构建图快照
        required: false
        type: boolean
        default: true
      sync_stock_locations:
        description: 是否增量同步上市公司所在地（会访问巨潮/akshare，默认关闭）
        required: false
        type: boolean
        default: false
      stock_location_limit:
        description: 所在地同步本次最多新增抓取数量，0 表示不限制
        required: false
        type: string
        default: '100'
      stock_location_sleep:
        description: 所在地同步每只股票请求间隔秒数
        required: false
        type: string
        default: '1.5'
  push:
    branches:
      - main
    # 数据/产物/文档类提交不触发 Pages 重建，避免 bot 提交自激循环。
    # 前端产物（index.html / 静态资源）不做忽略：前端更新必须能上线。
    paths-ignore:
      - "data/**"
      - "outputs/app/data/**"
      - "outputs/html/**"
      - "outputs/market/**"
      - "outputs/dragon_tiger/**"
      - "outputs/*.html"
      - "docs/**"
      - "**.md"
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # push 只做轻量校验：字节编译 + 离线构建，不跑完整同步
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile
        run: python -m compileall -q src scripts

      # 无网络冒烟：把各 SYNC_* 关掉跑一遍编排脚本，验证接线没断
      - name: Offline pipeline smoke
        env:
          PYTHON_BIN: python
          SYNC_DRAGON_TIGER: '0'
          SYNC_MARKET_OVERVIEW: '0'
          SYNC_NEWS: '0'
          BUILD_GRAPHS: '0'
          SYNC_STOCK_LOCATIONS: '0'
        run: bash run_daily_sync.sh

      - name: Build pages site (offline)
        run: python scripts/build_pages_site.py

  # 定时/手动触发：跑同步 -> 提交数据 -> 上传 Pages 产物
  build-pages:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      should_deploy: ${{ steps.sync.outputs.should_deploy }}
    env:
      TARGET_DATE: ${{ inputs.target_date || '' }}
      BACKFILL_START_DATE: ${{ inputs.backfill_start_date || '' }}
      BACKFILL_END_DATE: ${{ inputs.backfill_end_date || '' }}
      BACKFILL_AREAS: ${{ inputs.backfill_areas || 'all' }}
      BACKFILL_FROM_JSON: ${{ inputs.backfill_from_json && '1' || '0' }}
      FORCE_RUN: ${{ inputs.force_run && '1' || '0' }}
      MARKET_OVERVIEW_YEAR: ${{ inputs.market_overview_year || '' }}
      SYNC_NEWS: '0'
      BUILD_GRAPHS: ${{ inputs.build_graphs == false && '0' || '1' }}
      SYNC_STOCK_LOCATIONS: ${{ inputs.sync_stock_locations && '1' || '0' }}
      SYNC_MARKET_OVERVIEW: '1'
      SYNC_DRAGON_TIGER: '1'
      ANALYZE_DRAGON_TIGER: '1'
      STOCKGRAPH_HOT_MAX_WORKERS: '1'
      STOCKGRAPH_HISTORY_MAX_WORKERS: '2'
      STOCKGRAPH_REQUEST_DELAY_SECONDS: '0.8'
      STOCK_LOCATION_LIMIT: ${{ inputs.stock_location_limit || '100' }}
      STOCK_LOCATION_SLEEP: ${{ inputs.stock_location_sleep || '1.5' }}
      FAIL_ON_TASK_FAILURE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Run routine or backfill sync
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          FORCE_ARGS=()
          if [[ "$FORCE_RUN" == "1" ]]; then
            FORCE_ARGS+=(--force)
          fi
          if [[ -n "$BACKFILL_START_DATE" || -n "$BACKFILL_END_DATE" ]]; then
            if [[ -z "$BACKFILL_START_DATE" || -z "$BACKFILL_END_DATE" ]]; then
              echo "backfill_start_date and backfill_end_date must be provided together" >&2
              exit 1
            fi
            if [[ "$BACKFILL_FROM_JSON" == "1" ]]; then
              python scripts/backfill_from_json.py \
                --start-date "$BACKFILL_START_DATE" \
                --end-date "$BACKFILL_END_DATE" \
                --areas "$BACKFILL_AREAS"
              python scripts/build_unified_app.py
              echo "should_commit=true" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              python scripts/backfill_history.py \
                --start-date "$BACKFILL_START_DATE" \
                --end-date "$BACKFILL_END_DATE" \
                --areas "$BACKFILL_AREAS" \
                "${FORCE_ARGS[@]}"
            fi
          else
            TARGET_ARGS=()
            if [[ -n "$TARGET_DATE" ]]; then
              TARGET_ARGS+=(--target-date "$TARGET_DATE")
            fi
            python scripts/routine_daily_sync.py "${TARGET_ARGS[@]}" "${FORCE_ARGS[@]}"
          fi

      - name: Build Pages site
        if: steps.sync.outputs.should_deploy == 'true'
        run: python scripts/build_pages_site.py

      - name: Commit generated data
        if: steps.sync.outputs.should_commit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/market_overview outputs/app outputs/dragon_tiger outputs/html outputs/market outputs/.nojekyll
          if [[ -e data/reference/stock_location_mapping.json ]]; then
            git add data/reference/stock_location_mapping.json
          fi
          if [[ -e data/shared_state/stock_location_profile_cache.json ]]; then
            git add data/shared_state/stock_location_profile_cache.json
          fi
          if git diff --cached --quiet; then
            echo "[stockgraph] no generated data changes to commit"
          else
            git commit -m "chore(data): update routine market data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Check artifact size
        if: steps.sync.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "== outputs 下最大的 10 个文件 =="
          find outputs -type f -printf '%s\t%p\n' | sort -rn | head -10 | awk -F'\t' '{printf "%8.2f MB  %s\n", $1/1048576, $2}'
          # GitHub Pages artifact 单文件上限 100MB（与 git 一致），提前失败并给出明确信息
          BIG=$(find outputs -type f -size +95M || true)
          if [[ -n "$BIG" ]]; then
            echo "::error::以下产物超过 95MB，会被 GitHub 拒绝，请检查分片是否生效："
            echo "$BIG"
            exit 1
          fi

      # manifest 与主索引必须同步：主索引分片了但 manifest 没标记 sharded，
      # 前端不会加载分片，模块会静默渲染空白（HTTP 全 200，极难发现）。
      - name: Check artifact consistency
        if: steps.sync.outputs.should_deploy == 'true'
        run: python scripts/check_artifact_consistency.py

      - name: Upload Pages artifact
        if: steps.sync.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs

  deploy:
    if: github.event_name != 'push' && needs.build-pages.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-pages
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # push 触发时只重建并部署静态站点，不跑数据同步
  build-push-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build Pages site
        run: python scripts/build_pages_site.py

      - name: Check artifact size
        shell: bash
        run: |
          set -euo pipefail
          BIG=$(find outputs -type f -size +95M || true)
          if [[ -n "$BIG" ]]; then
            echo "::error::以下产物超过 95MB，会被 GitHub 拒绝："
            echo "$BIG"
            exit 1
          fi

      - name: Check artifact consistency
        run: python scripts/check_artifact_consistency.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs

  deploy-push-pages:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-push-pages
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # deploy-pages 的 Pages 同步阶段有约 10 分钟硬上限。当前 outputs 约 344MB，
        # 其中 app/data 约 275MB、历史产物 html/market/dragon_tiger 约 71MB。
        # 实测该步骤会间歇性卡在 syncing_files 超时（构建本身始终成功），
        # 重跑或重新触发通常可过；若持续失败，优先清理 outputs 下的历史产物。
        uses: actions/deploy-pages@v5
