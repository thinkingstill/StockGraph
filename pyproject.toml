[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockgraph"
version = "0.1.0"
description = "A-share market intelligence workspace with extensible ingestion, graph analysis, and AI analysis architecture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.16.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# FalkorDB 图数据库后端（可选，默认使用 SQLite）
falkordb = ["falkordb>=1.0.0"]
# 东方财富部分接口需要浏览器 TLS 指纹，装了这个适配器更稳
http = ["curl_cffi>=0.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
