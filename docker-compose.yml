# 可选：本地拉起 FalkorDB 作为 StockGraph 的图后端。
#   docker compose up -d
#   python scripts/graph_backend.py switch falkordb --migrate
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: stockgraph-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis 协议（StockGraph 走这个）
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
